<meta name="theme-color" content="#FFFFFF">
<title>Ops Hub | Sands Macao</title>
<style>
:root{--gold:#B8935A;--gold-d:#8C6B34;--gold-l:#EFE5D0;--ivory:#FBF8F2;--ink:#2B2620;--mut:#6F6556;--line:#E6DDCB;--ok:#2E7D5B;--warn:#B26A00;--bad:#B3342B;--card:#fff;
--font:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--ivory);color:var(--ink);font-size:16px;line-height:1.4}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.top img{height:40px;display:block}
.top .nm{font-weight:700;font-size:18px;letter-spacing:.2px;white-space:nowrap;min-width:0}
.top .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--mut);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.chipbtn{white-space:nowrap;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;background:var(--gold-l);font-weight:600;font-size:14px;min-height:40px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 120px}
.wide{max-width:none}
h2.sec{font-size:15px;color:var(--mut);font-weight:600;margin:20px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:18px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.btn.pri{background:var(--gold-d);border-color:var(--gold-d);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:42px;font-size:15px;width:auto;padding:8px 14px;border-radius:10px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 14px;min-height:112px;border-radius:16px;background:#fff;border:2px solid var(--line);text-align:left;font-weight:700;font-size:17px}
.tile:active{border-color:var(--gold)}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--gold-l);color:var(--gold-d);display:flex;align-items:center;justify-content:center}
.tile small{font-weight:400;color:var(--mut);font-size:13px}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{display:flex;width:100%;max-width:520px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12.5px;color:var(--mut);min-height:62px;font-weight:600;position:relative}
.tabs button.on{color:var(--gold-d)}
.dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.item{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#fff}
.item:last-child{border-bottom:0}
.item .ic{width:42px;height:42px;border-radius:11px;background:var(--gold-l);color:var(--gold-d);display:flex;align-items:center;justify-content:center;flex:none}
.item b{display:block;font-size:16px}
.item small{color:var(--mut);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:12.5px;font-weight:700;background:#EFEAE0;color:#5B5244;white-space:nowrap}
.chip.ok{background:#E1F1E8;color:#1F6A49}.chip.warn{background:#FFEFD2;color:#8F5400}.chip.bad{background:#FBE3E0;color:var(--bad)}.chip.gold{background:var(--gold-l);color:var(--gold-d)}
.empty{padding:30px 16px;text-align:center;color:var(--mut)}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=number],input[type=tel],select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 12px;background:#fff;min-height:52px}
textarea{min-height:96px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:20px;background:#fff;border:2px solid var(--line);font-weight:600;font-size:14.5px;min-height:42px}
.seg button.on{background:var(--gold-d);border-color:var(--gold-d);color:#fff}
.note{font-size:13.5px;color:var(--mut);margin-top:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:15px}
.kv span:nth-child(odd){color:var(--mut)}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bub{max-width:86%;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:15.5px;word-wrap:break-word;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--gold-l);border-color:#E2D3B3}
.bub .by{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:2px}
.bub img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.bub .ext{font-size:11.5px;font-weight:700;color:var(--gold-d)}
.sys{align-self:center;font-size:12.5px;color:var(--mut);background:#F2ECDF;border-radius:10px;padding:4px 10px;text-align:center}
.rec{display:flex;align-items:center;gap:8px;color:var(--bad);font-weight:700}
.rec i{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.25}}
.aibox{background:#F6F0E2;border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
#banner{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;max-width:500px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;z-index:100;transform:translateY(-320%);transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:left;width:calc(100% - 20px)}
#banner.show{transform:none}
#banner b{display:block;color:#E9D7B0}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:120;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

 });

 });

function toneWav(parts){
 const sr=22050;let n=0;parts.forEach(p=>n+=Math.floor(sr*p[1]));
 const buf=new ArrayBuffer(44+n*2),v=new DataView(buf),W=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 W(0,'RIFF');v.setUint32(4,36+n*2,true);W(8,'WAVE');W(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);W(36,'data');v.setUint32(40,n*2,true);
 let o=44;parts.forEach(([f,d])=>{const m=Math.floor(sr*d);for(let i=0;i<m;i++){const env=Math.min(1,i/180,(m-i)/360),val=Math.sin(2*Math.PI*f*i/sr)*env*0.85;v.setInt16(o,Math.round(val*32767),true);o+=2}});
 let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return 'data:audio/wav;base64,'+btoa(bin)}

['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockSnd,{capture:true,passive:true}));

const startToday=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};

function shiftHr(h,name){const sh=(CFG().shifts||{})[name];if(!sh)return true;const [x,y]=sh.map(v=>+v.split(':')[0]);return x<=y?(h>=x&&h<y):(h>=x||h<y)}

function kpiCalc(L){const cl=L.filter(t=>t.status==='closed'&&t.resMin!=null),on=cl.filter(t=>t.resMin<=t.etaMin);return {n:L.length,closed:cl.length,avg:avgA(cl.map(t=>t.resMin)),pct:cl.length?Math.round(on.length/cl.length*100):0,esc:L.length?Math.round(L.filter(t=>t.escalated).length/L.length*100):0}}

function spark(a,col){if(!a||a.length<2)return '';const mx=Math.max(...a,1),mn=Math.min(...a,0);const pts=a.map((v,i)=>`${(i/(a.length-1)*100).toFixed(1)},${(27-(v-mn)/((mx-mn)||1)*23).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:30px;display:block;margin-top:6px" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col||'#B8935A'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}

function pInit(u){return String(u.en||u.zh||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function pCard(u){
 const col=deptColor(u.dept),st=onBreak(u)?T('On break'):u.online?T('Signed in'):T('Offline');
 return `<button class="ocard" data-a="uedit" data-v="${u.id}" style="--c:${col}" title="${esc(T('Click to edit'))}"><span class="oav" style="background:${col}">${esc(pInit(u))}</span><span class="otx"><b>${esc(uname(u))}</b><small>${esc(T(u.title))}</small></span><span class="chip lvl${u.level}">${T(LV[u.level])}</span><i class="ost ${u.online?'on':''}" title="${esc(st)}"></i></button>`}
function unitTree(d){
 const P=CFG().users.filter(u=>u.dept===d&&u.level<4).sort((a,b)=>b.level-a.level||uname(a).localeCompare(uname(b)));
 const kids={},roots=[];P.forEach(p=>kids[p.id]=[]);
 P.forEach(p=>{const hi=P.filter(q=>q.level>p.level);if(!hi.length){roots.push(p);return}const top=Math.min(...hi.map(q=>q.level)),c=hi.filter(q=>q.level===top).sort((x,y)=>kids[x.id].length-kids[y.id].length);kids[c[0].id].push(p)});
 const li=p=>`<li>${pCard(p)}${kids[p.id].length?`<ul>${kids[p.id].map(li).join('')}</ul>`:''}</li>`;
 return roots.length?`<ul class="otree">${roots.map(li).join('')}</ul>`:`<p class="note">${T('No people in this business unit yet')}</p>`}

function mapClamp(){MV.w=Math.min(MV0.w,Math.max(190,MV.w));MV.h=MV.w*MV0.h/MV0.w;MV.x=Math.min(MV0.w-MV.w,Math.max(0,MV.x));MV.y=Math.min(MV0.h-MV.h,Math.max(0,MV.y))}

function mapZoomAt(f,cx,cy){const sv=$('#floorSvg');if(!sv)return;const r=sv.getBoundingClientRect();const px=(cx-r.left)/r.width,py=(cy-r.top)/r.height,sx=MV.x+px*MV.w,sy=MV.y+py*MV.h;MV.w=Math.min(MV0.w,Math.max(190,MV.w/f));MV.h=MV.w*MV0.h/MV0.w;MV.x=sx-px*MV.w;MV.y=sy-py*MV.h;mapClamp();mapApply()}

   addMsg(t,{by:me.id,k:r.orig?'voice':'text',txt:r.text.trim(),orig:r.orig,img:r.img});Store.saveThread(t);D.reply={text:'',orig:null,img:null};render(true);break}
  case 'approve':act(t,'approve',{comment:(V.cm||'').trim()});V.cm='';toast(T('Approved'));break;
  case 'reject':act(t,'reject',{comment:(V.cm||'').trim()});V.cm='';toast(T('Rejected'));break;
  case 'take':act(t,'take');break;
  case 'close':act(t,'close',{note:D.reply.text.trim()});D.reply={text:'',orig:null,img:null};toast(T('Message closed'));break;
  case 'escalate':act(t,'escalate');toast(T('Escalated. Managers were alerted.'));break;
  case 'share':doShare(t,v);render(true);break;
  case 'logext':V.modal={kind:'ext',ch:'wa',who:'',txt:''};render(true);break;
  case 'extch':{const m=V.modal;m.who=$('#ext-who').value;m.txt=$('#ext-tx').value;m.ch=v;render(true);break}
  case 'extsave':{const tx=$('#ext-tx').value.trim();if(!tx){toast(T('Paste the reply first.'));return}
   const who=$('#ext-who').value.trim();addMsg(t,{by:me.id,k:'text',txt:(who?who+': ':'')+tx,ch:V.modal.ch});Store.saveThread(t);V.modal=null;render(true);break}
  case 'uadd':V.modal={kind:'user',id:null};render(true);break;
  case 'uview':V.uview=v;render(true);break;
  case 'uedit':V.modal={kind:'user',id:v};render(true);break;
  case 'usave':{
   const en=$('#u-en').value.trim();if(!en){toast(T('Enter a name.'));return}
   const o={en,zh:$('#u-zh').value.trim()||en,title:$('#u-ti').value.trim()||'Staff',dept:$('#u-de').value,level:+$('#u-lv').value,wa:$('#u-wa').value.trim(),wc:$('#u-wc').value.trim(),on:$('#u-on').checked,skills:[...document.querySelectorAll('[data-sk]:checked')].map(x=>x.dataset.sk),at:$('#u-at').value};
   const npw=($('#u-pw')?$('#u-pw').value:'').trim();if(npw&&npw.length<4){toast(T('At least 4 characters.'));return}
   if(npw)o.pw=await makePw(npw);
   if(v)Object.assign(userBy(v),o);else CFG().users.push(Object.assign({id:'u'+uidg()},o));
   Store.saveCfg();audit(v?'User edited':'User added',en);V.modal=null;toast(T('Saved'));render(true);break}
  case 'applydef':{const d=CFG().defaults;CFG().types.forEach(x=>{x.eta=d.eta;x.esc=d.esc;x.escLevel=d.escLevel});Store.saveCfg();toast(T('Defaults applied'));render(true);break}
  case 'speed':CFG().speed=+v;Store.saveCfg();render(true);break;
  case 'reset':if(confirm(T('Reset all demo data and settings?')))Store.resetAll().then(()=>{audit('Demo data reset','');toast(T('Demo data reset'))});break;
  case 'period':V.period=+v;render(true);break;
  case 'csv':csvDownload();break;
 }
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.lg&&V.lg){V.lg[e.target.dataset.lg]=e.target.value;return}
 
 const b=e.target.dataset&&e.target.dataset.bind;if(!b)return;
 if(b.includes('.')){const[c,f]=b.split('.');D[c][f]=e.target.value;if(f==='text'&&D[c].orig)D[c].orig=D[c].orig}else if(b==='cm')V.cm=e.target.value;else V[b]=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.uunit!==undefined){V.uunit=e.target.value;render(true);return}
 if(e.target.dataset&&e.target.dataset.df){dfGet()[e.target.dataset.df]=e.target.value;render(true);return}
 if(e.target.dataset&&e.target.dataset.lg&&V.lg){V.lg[e.target.dataset.lg]=e.target.value;if(e.target.dataset.lg==='dept'){V.lg.uid='';V.lg.pw='';V.lgErr='';try{localStorage.setItem('oh_bu',e.target.value)}catch(x){}}
  if(e.target.dataset.lg==='uid'){const uu=userBy(e.target.value);V.lg.at=uu?uu.at:'';V.lg.shift=uu?uu.shift:'';V.lg.avail=true}if(!['pw','emp'].includes(e.target.dataset.lg))render(true);return}
 
 if(e.target.dataset&&e.target.dataset.me){const k=e.target.dataset.me;if(k==='at')me.at=e.target.value;else me.avail=e.target.checked;Store.saveCfg();toast(T('Saved'));return}
 if(e.target.hasAttribute&&e.target.hasAttribute('data-ra')){try{localStorage.setItem('oh_ra',e.target.checked?'1':'0')}catch(x){}toast(T('Saved'));return}
 if(e.target.hasAttribute&&e.target.hasAttribute('data-tr')){try{localStorage.setItem('oh_tr',e.target.checked?'1':'0')}catch(x){}toast(T('Saved'));render(true);return}
 const t=e.target,b=t.dataset&&t.dataset.bind,c=t.dataset&&t.dataset.cfg;
 if(b==='heatR'){V.heatR=t.value;render(true);return}
 if(b==='send.typeId'){D.send.typeId=t.value;D.send.approverId='';render(true)}
 else if(b==='send.approverId')D.send.approverId=t.value;
 else if(b==='send.amount'){D.send.amount=t.value;render(true)}
 else if(b==='rf'||b==='hq'){V[b]=t.value;render(true)}
 if(c){const p=c.split(':');let v=t.type==='checkbox'?t.checked:t.value;
  if(p[0]==='s'){CFG().defaults[p[1]]=+v}else if(p[0]==='p'){profEdit(p[1],p[2],v)}else if(p[0]==='r'){CFG().roster[p[1]]=p[1]==='enforce'?v==='1':v}else if(p[0]==='dc'){CFG().deptColors=Object.assign({},CFG().deptColors||DEPT_COL_DEF);CFG().deptColors[p[1]]=v}else if(p[0]==='dn'){renameTeam(p[1],(v||'').trim())}else if(p[0]==='tg'){CFG().targets=CFG().targets||{};CFG().targets[p[1]]=Math.max(0,+v||0)}else if(p[0]==='sec'){CFG().security=CFG().security||{};CFG().security[p[1]]=p[1]==='lockAfter'?Math.max(1,+v||5):v==='1'}else if(p[0]==='sh'){CFG().shifts[p[1]][+p[2]]=v}else if(p[0]==='u'){const uu=userBy(p[1]);if(uu)uu[p[2]]=v}
  else{const ty=typeBy(p[1]);if(['eta','esc','escLevel','apprLevel'].includes(p[2]))v=Math.max(1,+v);if(['lim1','lim2'].includes(p[2]))v=Math.max(0,+v||0);if(['appr','amount','near'].includes(p[2]))v=v==='1';ty[p[2]]=v}
  Store.saveCfg();audit('Setting changed',c+' = '+v);toast(T('Saved'));render(true)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lg-pw'){const b=$('[data-a="lgsign"]');if(b)b.click()}});
document.addEventListener('keyup',e=>{if(e.target.id==='aq'){V.aq=e.target.value;clearTimeout(window.__aq);window.__aq=setTimeout(()=>{render(true);const n=$('#aq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)}
 if(e.target.id==='hq'){V.hq=e.target.value;clearTimeout(window.__hq);window.__hq=setTimeout(()=>{render(true);const n=$('#hq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250)}});
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(pending&&!typing())render(true)},80)});

/* ticking clocks */
setInterval(()=>{
 if(!ST.cfg)return;
 document.querySelectorAll('[data-eta]').forEach(n=>{const t=ST.threads[n.dataset.eta];if(!t||!isActive(t))return;const left=t.etaMin-elapsed(t);n.className='chip '+(left<0?'bad':'gold');n.textContent=(left<0?T('Overdue'):T('ETA'))+' '+fmtMin(Math.abs(left))});
},1000);
setInterval(()=>{if(ST.cfg){const before=JSON.stringify(Object.values(ST.threads).map(t=>t.escalated));checkEsc();if(before!==JSON.stringify(Object.values(ST.threads).map(t=>t.escalated))){checkPings();render()}}},4000);

const isNarrow=()=>window.innerWidth<=620||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
function fit(){document.body.classList.toggle('narrow',isNarrow());if(isNarrow()){document.documentElement.style.setProperty('--s',1);return}document.documentElement.style.setProperty('--s',Math.min(1,(window.innerHeight-28)/868).toFixed(3))}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
if(!window.__MODE)window.addEventListener('hashchange',()=>location.reload());
document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)&&isNarrow()){const t=e.target;setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},320)}});
document.addEventListener('click',e=>{if(isNarrow()&&e.target.closest&&e.target.closest('button')&&navigator.vibrate){try{navigator.vibrate(8)}catch(x){}}},true);
let BIP=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();BIP=e});
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
window.__swReg=null;
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&window.top===window&&document.querySelector('link[rel=manifest]')){navigator.serviceWorker.register('sw.js').then(r=>{window.__swReg=r}).catch(()=>{})}
setInterval(()=>{if(MODE==='console'&&V.cpage==='dash'&&ST.cfg&&me&&!V.modal&&!DEMO.on)render()},15000);
setInterval(()=>{const c=document.getElementById('liveClock');if(c)c.textContent=fmtClock(now())},1000);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&V.wall){V.wall=false;document.body.classList.remove('wall');render(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.modal&&!V.wall){V.modal=null;render(true);return}if(e.key==='Escape'&&V.wall){V.wall=false;document.body.classList.remove('wall');try{document.fullscreenElement&&document.exitFullscreen()}catch(x){}render(true)}});
/* boot */
(async()=>{
 await Store.init();
 try{const id=sessionStorage.getItem('oh_me');if(id){const u=userBy(id);if(u&&u.online){u.online=false;Store.saveCfg()}sessionStorage.removeItem('oh_me')}}catch(e){}
 V.screen='login';me=null;
 if(MODE==='console'){me=CFG().users.find(u=>u.level===4&&u.on)||CFG().users.find(u=>u.level>=3&&u.on)||CFG().users[0];V.screen='console';V.cpage='dash'}
 if(me){baselined=false;checkPings()}
 render(true);
})();
</script>
</body>
